server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Don't cache JSON. HIVE-333 P1-2: prefer the live copy written by the
    # generator sidecar into the shared emptyDir (/live); the baked-in file is
    # only the first-boot fallback until the sidecar's first run completes.
    location = /status.json {
        try_files /live/status.json /status.json =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Don't cache RSS
    location /incidents.rss {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
