# HIVE-725 — dedicated L4 boundary for Connect -> Hive message delivery.
#
# Apply together with shizuha-hive-netpol.yaml. The Service selects the current
# production backend (`app: hive`, `component: backend`) and exposes only the
# delivery-only Daphne listener. Scheduled Hive workers deliberately share the
# legacy `app: hive` label but do not listen on 8031, so the component selector
# is part of the availability boundary. NetworkPolicy admits this target port
# solely from exact Connect backend pods; application HMAC/tenant checks remain
# the second control.
apiVersion: v1
kind: Service
metadata:
  name: hive-connect-delivery
  namespace: shizuha-hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: connect-delivery
    shizuha.io/task: hive-725
spec:
  type: ClusterIP
  selector:
    app: hive
    app.kubernetes.io/component: backend
  ports:
    - name: connect-delivery
      protocol: TCP
      port: 8031
      targetPort: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-connect-delivery-ingress
  namespace: shizuha-hive
  labels:
    app.kubernetes.io/managed-by: shizuha-hive
    shizuha.io/policy: connect-delivery-isolation
    shizuha.io/task: hive-725
spec:
  podSelector:
    matchLabels:
      app: hive
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shizuha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: shizuha-connect
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: 8031 }
