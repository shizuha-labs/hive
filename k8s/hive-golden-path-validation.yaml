# HIVE-580 (HIVE-423 recurrence): weekly golden-path validation.
#
# Runs the HIVE-420 harness (claws/management/commands/run_golden_path_validation)
# in-pod each week so HIVE-423 cycles report real green/red data instead of
# reachability-only probing.
#
# This manifest is the declarative reference for review. The LIVE CronJob is
# generated by .forgejo/workflows/deploy.yml from the post-rollout Deployment's
# own pod spec, so it inherits the exact CI-promoted image and DB/JWT env
# (contract clause 6 — no hand-built tag, no bootstrap tag, no manual set-image).
# claws/test_hive580_golden_path_cronjob.py asserts the two agree and that the
# contract clauses below hold, so the pair cannot drift apart silently.
#
# Contract (sora, 2026-07-16 Architecture disposition on HIVE-580):
#   1. weekly AND event-driven on material Origin merges
#   2. attempt the live six-stage recipe; unreachable stages recorded RED/BLOCKED
#      with their exact reason — no fake endpoints, no fabricated artifacts
#   3. publish + notify BEFORE process exit; RED/BLOCKED then exits non-zero;
#      a skipped or missing run is also RED (see hive-golden-path-alerts.yaml).
#      HIVE-2697 ruling 1 carve-out: the by-design adapter-pending saga park
#      (stage 2 at the registry-derived next un-implemented leg — `pulse`
#      after HIVE-2715's adapter-backed id_org) is the explicit
#      `expected-blocked-saga-wip` outcome and exits 0 — loud in the
#      scorecard, silent to the pager.
#   4. strict teardown with zero-residue assertions
#   5. credentials provisioned OUTSIDE the workload, consumed fail-closed;
#      no init container may bootstrap or overwrite its own required Secret
#   6. exact CI-produced image promoted by Origin
#   7. first-run scorecard closes HIVE-580 even if RED
#
# The expected steady state while the id_org adapter (the HIVE-418 epic's
# real scope) is unimplemented is `expected-blocked-saga-wip` (exit 0, loud
# scorecard line — HIVE-2697 ruling 1): HIVE-566 deliberately stops
# non-dry-run provisioning at manual_review, so stages 3-5 are not reachable,
# but that bridge is by design and must NOT page devops. Any OTHER red or
# blocked stage remains a real RED result and still pages.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-golden-path-validation
  namespace: shizuha-hive
  labels:
    app: hive
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: golden-path-validation
    shizuha.io/task: HIVE-580
spec:
  # Weekly, Mondays 04:23 UTC. Off the hour to avoid the reconciler herd.
  schedule: "23 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: a RED scorecard is a real result to publish, not a flake to
      # paper over by re-running until it looks green.
      backoffLimit: 0
      # The live journey crosses signup -> provision -> brief -> execute ->
      # deliverable -> teardown, so it needs more headroom than a reconciler.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: hive
            app.kubernetes.io/name: hive
            app.kubernetes.io/component: golden-path-validation
        spec:
          restartPolicy: Never
          serviceAccountName: hive-controller
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: shizuha.io/platform
                        operator: In
                        values: ["true"]
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: ["s1"]
          tolerations:
            - key: node.shizuha/workstation
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: validator
              image: localhost:30500/shizuha-hive:latest
              imagePullPolicy: Always
              # All cycle logic lives in the management command so it is
              # unit-testable in premerge and so this manifest and the deploy
              # workflow invoke ONE implementation rather than carrying
              # duplicate shell that would drift apart. It rotates the brief
              # tier, refuses to run without the scoped credential (exit 3),
              # publishes the scorecard, and only then exits 2 on RED.
              command:
                - python
                - manage.py
                - run_golden_path_cycle
              env:
                - name: DB_NAME
                  value: shizuha_hive
                - name: DB_USER
                  value: postgres
                - name: DB_PASSWORD
                  valueFrom: {secretKeyRef: {name: shizuha-infra-postgresql, key: postgres-password}}
                - name: DB_HOST
                  value: shizuha-infra-postgresql.shizuha.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: JWT_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: hive-secrets, key: jwt-secret}}
                - name: SHIZUHA_ID_INTERNAL_URL
                  value: http://shizuha-id.shizuha.svc.cluster.local:8001
                - name: ID_BASE_URL
                  value: https://shizuha.com/id
                - name: HIVE_BASE_URL
                  value: https://shizuha.com
                # Clause 5: required (NOT optional) — a missing Secret must stop
                # the pod rather than silently degrade to an anonymous run.
                - name: VALIDATION_RUNTIME_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hive-golden-path-validation
                      key: validation-runtime-token
