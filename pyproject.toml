[project]
name = "shizuha-hive"
version = "0.1.0"
description = "Shizuha Hive control plane"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.2",
    "daphne>=4.0",
    "channels>=4.0",
    "channels-redis>=4.0",
    "kubernetes>=28.1",
    "requests>=2.31",
    "cryptography>=50.0.0",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
# Security floor (PLAT-6725): aiohttp is transitive via kubernetes; pin the
# patched floor so uv resolves >=3.14.3 (GHSA-cq5v-8q36-5273 et al).
constraint-dependencies = ["aiohttp>=3.14.3"]
