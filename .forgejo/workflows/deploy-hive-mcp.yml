# Shizuha Origin CI/CD — multi-arch build + deploy of the Hive MCP server.
#
# The Hive MCP server (mcp-server/) is a standalone streamable-HTTP daemon
# (its own image), unlike the Hive Django backend (built by deploy.yml). It is
# deployed as the `shizuha-hive-mcp` Deployment/Service in ns `shizuha`
# (alongside the other platform MCP services) and proxies to the Hive backend
# in ns `shizuha-hive` via SHIZUHA_HIVE_URL. HIVE-440 / HIVE-435.
#
# Path-filtered to mcp-server/** so a backend-only commit does not rebuild the
# MCP image (and vice-versa). The build pushes to the in-cluster registry; the
# workload image reference uses localhost:30500 because every k3s node maps that
# insecure alias to the registry NodePort. The MCP daemon is stateless (no DB /
# migrations) — it authenticates to the backend per-request, so there is no
# migrate gate here.
name: deploy-hive-mcp
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'mcp-server/**'
      - '.forgejo/workflows/deploy-hive-mcp.yml'
      - '.forgejo/scripts/hive-mcp-release.sh'
      - '.forgejo/scripts/render-hive-mcp-deployment.py'
      - 'tests/test_hive_mcp*.py'
concurrency:
  group: deploy-hive-mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        env:
          ORIGIN_TOKEN: ${{ secrets.CI_PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "http://x-token-auth:${ORIGIN_TOKEN}@forgejo-http.origin.svc.cluster.local/shizuha-labs/hive.git"
          git fetch --no-tags origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Verify release and authentication deployment contracts
        run: python3 -m unittest discover -s tests -p 'test_hive_mcp*.py' -v
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Arch-aware kubectl install: ubuntu-* runners may be arm64, so a
          # hard-coded amd64 binary exits with "Exec format error" and fails the
          # deploy before any rollout logic runs (ORIG-37). Map uname -> k8s arch.
          case "$(uname -m)" in
            x86_64|amd64)  KARCH=amd64 ;;
            aarch64|arm64) KARCH=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          case "$KARCH" in
            amd64) KUBECTL_SHA=7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3 ;;
            arm64) KUBECTL_SHA=420e6110e3ba7ee5a3927b5af868d18df17aae36b720529ffa4e9e945aa95450 ;;
          esac
          # anonymous-fetch: sanctioned — adding Authorization can turn this public package fetch into 401 (ORIG-144)
          curl --retry 3 --retry-all-errors --retry-delay 1 --max-time 60 -fsSL \
            -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KARCH}"
          echo "$KUBECTL_SHA  kubectl" | sha256sum -c -
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # PLAT-7708: refuse a rolled-back sha BEFORE any build/mutation — the
          # ledger is the deny list populated by every rollback event. Fail loud,
          # never silently retry a rolled-back build (PLAT-7681 59e9439 class).
          source .forgejo/scripts/cd-rollback-ledger.sh
          cd_ledger_check shizuha shizuha-hive-mcp "${{ github.sha }}" || exit 1
      - name: Read exact canonical deployment authentication contract
        env:
          ORIGIN_TOKEN: ${{ secrets.CI_PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          SOURCE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SOURCE_DIR"' EXIT
          git -C "$SOURCE_DIR" init --quiet
          git -C "$SOURCE_DIR" remote add origin "http://x-token-auth:${ORIGIN_TOKEN}@forgejo-http.origin.svc.cluster.local/shizuha-labs/deploy.git"
          git -C "$SOURCE_DIR" fetch --quiet --depth=1 origin refs/heads/master
          DEPLOY_SHA="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD)"
          git -C "$SOURCE_DIR" show "${DEPLOY_SHA}:k3s/manifests/shizuha-hive-mcp.yaml" > hive-mcp-declared.yaml
          kubectl create --dry-run=client --validate=false -f hive-mcp-declared.yaml -o json > hive-mcp-declared.json
          echo "HIVE_MCP_MANIFEST_JSON=$PWD/hive-mcp-declared.json" >> "$GITHUB_ENV"
          echo "Hive MCP authentication contract source: deploy@${DEPLOY_SHA}"
      - name: Multi-arch build + deploy + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="mcp-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          IMG="shizuha-hive-mcp"
          echo "Multi-arch build ${IMG}:${TAG} (amd64 + arm64)"

          render_build_job() {
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-hive-mcp-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, service: hive-mcp }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/hive.git /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; building default HEAD")
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src/mcp-server
                      - --dockerfile=/workspace/src/mcp-server/Dockerfile
                      - --destination=${REG}/${IMG}:${TAG}-${ARCH}
                      - --cleanup
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/
                      - --build-arg=PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/hive-deploy-hive-mcp-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                      - --snapshot-mode=redo
                      - --use-new-run
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          for stale_job in $(kubectl get jobs -n build -l app=ci-build,service=hive-mcp \
            -o go-template='{{range .items}}{{if .status.active}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}'); do
            case "$stale_job" in
              "ci-build-hive-mcp-${SHORT}-amd64"|"ci-build-hive-mcp-${SHORT}-arm64") ;;
              *) echo "Deleting superseded active Hive MCP builder: $stale_job"; kubectl delete job -n build "$stale_job" --wait=false ;;
            esac
          done
          # Delete same-SHA leftovers first — 'apply' on an existing completed/failed
          # Job is 'unchanged' and a rerun can never succeed (HIVE-312).
          kubectl delete job -n build "ci-build-hive-mcp-${SHORT}-amd64" "ci-build-hive-mcp-${SHORT}-arm64" --ignore-not-found
          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM

          wait_job() {
            local ARCH="$1"
            local JOB="ci-build-hive-mcp-${SHORT}-${ARCH}"
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1800s &
            local WP=$!
            while kill -0 "$WP" 2>/dev/null; do
              if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
                echo "::error::kaniko ${ARCH} build failed"
                kubectl logs -n build "job/${JOB}" --all-containers --tail=80 || true
                exit 1
              fi
              sleep 5
            done
            wait "$WP"
          }
          wait_job amd64 &
          WAIT_AMD64_PID=$!
          wait_job arm64 &
          WAIT_ARM64_PID=$!
          WAIT_FAILED=0
          wait "${WAIT_AMD64_PID}" || WAIT_FAILED=1
          wait "${WAIT_ARM64_PID}" || WAIT_FAILED=1
          if [ "${WAIT_FAILED}" -ne 0 ]; then
            exit 1
          fi

          kubectl delete job -n build "ci-manifest-hive-mcp-${SHORT}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-hive-mcp-${SHORT}
            namespace: build
            labels: { app: ci-manifest, service: hive-mcp }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/${IMG}:${TAG}
                      - -m
                      - ${REG}/${IMG}:${TAG}-amd64
                      - -m
                      - ${REG}/${IMG}:${TAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-hive-mcp-${SHORT}" --timeout=300s || {
            echo "::error::manifest combine failed"
            kubectl logs -n build "job/ci-manifest-hive-mcp-${SHORT}" --tail=80 || true
            exit 1
          }

          kubectl delete job -n build "ci-verify-hive-mcp-${SHORT}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-verify-hive-mcp-${SHORT}
            namespace: build
            labels: { app: ci-verify, service: hive-mcp }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: oauth-regression
                    image: localhost:30500/${IMG}:${TAG}
                    command: ["python", "test_oauth_defaults.py", "-v"]
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${IMG}/manifests/${TAG}"
                        accept = ",".join([
                            "application/vnd.oci.image.index.v1+json",
                            "application/vnd.docker.distribution.manifest.list.v2+json",
                        ])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {
                            f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                            for m in manifest.get("manifests", [])
                        }
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        print(f"{url} platforms={sorted(platforms)}")
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-verify-hive-mcp-${SHORT}" --timeout=120s || {
            echo "::error::manifest verification failed"
            kubectl logs -n build "job/ci-verify-hive-mcp-${SHORT}" --tail=80 || true
            exit 1
          }
          kubectl logs -n build "job/ci-verify-hive-mcp-${SHORT}" --tail=20 || true

          # The Deployment/Service manifest (shizuha-labs/deploy shizuha-hive-mcp.yaml)
          # must already be applied. Fail loud if it is missing rather than silently
          # skipping the roll.
          if ! kubectl get deploy -n shizuha shizuha-hive-mcp >/dev/null 2>&1; then
            echo "::error::deploy/shizuha-hive-mcp not found in ns shizuha — apply the deploy repo manifest (shizuha-hive-mcp.yaml) before the first MCP CI deploy"
            exit 1
          fi

          set +e
          .forgejo/scripts/monotonic-release-guard.sh shizuha shizuha-hive-mcp "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi
          TARGET_IMAGE="localhost:30500/${IMG}:${TAG}"
          source .forgejo/scripts/hive-mcp-release.sh
          hive_mcp_load_release_state
          hive_mcp_promote_candidate

          LIVE="$(kubectl get deploy -n shizuha shizuha-hive-mcp -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Live image: ${LIVE}"
          echo "${LIVE}" | grep -q "${TAG}" || { echo "::error::image mismatch"; exit 1; }
          kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-hive-mcp

          echo "Verifying Hive MCP transport rejects absent and invalid bearer credentials"
          kubectl delete job -n shizuha "ci-smoke-hive-mcp-${SHORT}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-smoke-hive-mcp-${SHORT}
            namespace: shizuha
            labels: { app: ci-smoke, service: hive-mcp }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.8.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        for credential in absent invalid; do
                          set --
                          if [ "\$credential" = invalid ]; then set -- -H 'Authorization: Bearer invalid'; fi
                          CODE="\$(curl -sS -D /tmp/headers -o /dev/null -w '%{http_code}' --max-time 10 \
                            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"hive_get_my_identity","arguments":{}}}' \
                            "\$@" http://shizuha-hive-mcp.shizuha.svc.cluster.local:18107/mcp)"
                          echo "\$credential bearer: HTTP \${CODE}"
                          [ "\${CODE}" = "401" ] || exit 1
                          grep -qi '^www-authenticate:.*Bearer.*resource_metadata=' /tmp/headers || exit 1
                        done
          YAML
          kubectl wait -n shizuha --for=condition=complete "job/ci-smoke-hive-mcp-${SHORT}" --timeout=120s || {
            hive_mcp_fail_candidate "in-cluster liveness smoke failed"
          }
          kubectl logs -n shizuha "job/ci-smoke-hive-mcp-${SHORT}" --tail=20 || true
          kubectl annotate -n shizuha deploy/shizuha-hive-mcp \
            shizuha.io/last-successful-sha="${{ github.sha }}" \
            shizuha.io/last-successful-image="${LIVE}" \
            --overwrite
          echo "Hive MCP deploy complete: ${LIVE}"
